<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>后台登录</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#0e0e0e;color:#fff;font-family:-apple-system}
.box{width:90%;max-width:360px;margin:120px auto}
input,button{width:100%;padding:12px;margin-top:12px;border-radius:6px;border:none}
button{background:#e53935;color:#fff}
</style>
</head>
<body>
<div class="box">
  <h2>后台管理登录</h2>
  <input placeholder="账号">
  <input type="password" placeholder="密码">
  <button>登录</button>
</div>
</body>
</html>
